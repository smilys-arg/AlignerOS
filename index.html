<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AlignerOS">
<meta name="theme-color" content="#2563eb">
<title>AlignerOS · Lab</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpolygon points='256,32 464,160 464,352 256,480 48,352 48,160' fill='%232563eb'/%3E%3Ctext x='256' y='300' text-anchor='middle' font-family='Inter,sans-serif' font-weight='bold' font-size='140' fill='white'%3EOS%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9;
  --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --accent:#2563eb; --accent2:#1d4ed8;
  --red:#dc2626; --yellow:#ca8a04; --green:#16a34a;
  --sp:#2563eb; --st:#7c3aed; --sc:#ea580c; --spo:#0891b2;
  --done:#64748b;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 4px 6px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --radius:10px; --radius-sm:6px;
  --nav-h:60px; --header-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}

header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:16px;box-shadow:var(--shadow-sm)}
.logo{font-family:'Inter',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.3px;color:var(--accent);display:flex;align-items:center;gap:6px}
.logo::before{content:'⬣';font-size:20px}
.desktop-nav{display:flex;gap:2px}
.tab{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;color:var(--text2);background:none;font-family:'Inter',sans-serif}
.tab:hover{color:var(--text);background:var(--surface2)}
.tab.active{color:var(--accent);background:rgba(37,99,235,.08)}
.header-right{display:flex;gap:12px;align-items:center;flex-shrink:0}
.sync-indicator{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sync-dot.offline{background:var(--red)}
.date-chip{font-size:12px;color:var(--text2);display:none}
.btn-new{padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s;touch-action:manipulation;box-shadow:var(--shadow-sm)}
.btn-new:hover{background:var(--accent2)}

main{padding:18px;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 18px);max-width:1280px;margin:0 auto}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.stat-card:hover{box-shadow:var(--shadow)}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;font-weight:500}
.stat-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;line-height:1;color:var(--text)}
.stat-value.urgent{color:var(--red)}.stat-value.warning{color:var(--yellow)}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px}

.alerts-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.alerts-bar::-webkit-scrollbar{display:none}
.alert-pill{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:20px;font-size:11px;border:1px solid;white-space:nowrap;flex-shrink:0;font-weight:500}
.alert-pill.red{border-color:rgba(220,38,38,.3);color:var(--red);background:rgba(220,38,38,.06)}
.alert-pill.yellow{border-color:rgba(202,138,4,.3);color:var(--yellow);background:rgba(202,138,4,.06)}
.alert-pill.green{border-color:rgba(22,163,74,.3);color:var(--green);background:rgba(22,163,74,.06)}
.alert-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

.filters-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;align-items:center}
.filters-row::-webkit-scrollbar{display:none}
.filter-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;flex-shrink:0;font-weight:500}
.filter-btn{padding:6px 14px;border-radius:4px;font-size:11px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;flex-shrink:0;touch-action:manipulation;transition:all .15s}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(37,99,235,.06)}

.kanban-wrap{overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 6px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:10px;min-width:980px}
.kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.col-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2)}
.col-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text)}
.col-dot{width:8px;height:8px;border-radius:50%}
.col-count{font-size:10px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
.col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px}

.arc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 12px 12px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.arc-card:hover{box-shadow:var(--shadow)}
.arc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.arc-card.urgente::before{background:var(--red)}
.arc-card.proximo::before{background:var(--yellow)}
.arc-card.ok::before{background:var(--green)}
.arc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.arc-patient{font-size:13px;font-weight:600;line-height:1.3}
.arc-type{font-size:9px;padding:2px 8px;border-radius:3px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;margin-left:6px}
.arc-type.sup{background:rgba(37,99,235,.1);color:var(--accent)}
.arc-type.inf{background:rgba(124,58,237,.1);color:var(--st)}
.arc-doctor{font-size:10px;color:var(--text3);margin-bottom:6px}
.alin-range{font-size:11px;color:var(--text2);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.arc-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.delivery-chip{font-size:10px;color:var(--text3)}
.delivery-chip.urgente{color:var(--red);font-weight:600}
.delivery-chip.proximo{color:var(--yellow)}
.quick-btns{display:flex;gap:4px}
.qbtn{padding:6px 10px;font-size:10px;border-radius:4px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;touch-action:manipulation;min-height:32px;font-family:'Inter',sans-serif}
.qbtn:hover{border-color:var(--accent);color:var(--accent)}
.qbtn.done-btn{border-color:rgba(22,163,74,.4);color:var(--green)}
.qbtn.done-btn:hover{background:rgba(22,163,74,.06)}
.kanban-alin-selector{display:none;margin-top:8px;padding:8px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);max-height:160px;overflow-y:auto}
.kanban-alin-selector.open{display:block}
.kanban-alin-item{display:inline-block;padding:3px 7px;margin:2px;border-radius:4px;font-size:10px;background:var(--border);color:var(--text2);cursor:pointer;user-select:none}
.kanban-alin-item.selected{background:var(--accent);color:#fff}
.empty-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 10px;color:var(--text3);font-size:11px;gap:6px;text-align:center}
.empty-icon{font-size:20px;opacity:.4}

.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.section-title{font-size:18px;font-weight:600;color:var(--text)}
.cases-list{display:flex;flex-direction:column;gap:10px}
.case-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.case-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:10px;border-bottom:1px solid transparent;transition:border-color .15s}
.case-card.open .case-header{border-bottom-color:var(--border)}
.case-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.case-prio-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.case-name{font-size:13px;font-weight:600}
.case-doctor{font-size:11px;color:var(--text3)}
.case-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.case-badge{font-size:9px;padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.case-badge.urgente{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.25)}
.case-badge.proximo{background:rgba(202,138,4,.1);color:var(--yellow);border:1px solid rgba(202,138,4,.25)}
.case-badge.ok{background:rgba(22,163,74,.06);color:var(--green);border:1px solid rgba(22,163,74,.2)}
.case-days{font-size:10px;color:var(--text3);display:none}
.chevron{color:var(--text3);font-size:12px;transition:transform .2s}
.case-card.open .chevron{transform:rotate(90deg)}
.case-body{padding:14px 16px;background:var(--surface2)}
.arcadas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arcada-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px}
.arcada-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text)}
.arc-badge{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:600}
.arc-badge.sup{background:rgba(37,99,235,.1);color:var(--accent)}
.arc-badge.inf{background:rgba(124,58,237,.1);color:var(--st)}
.arc-total-lbl{font-size:10px;color:var(--text3);margin-left:auto}
.alin-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.alin-chip{width:30px;height:24px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-weight:600;border:1px solid transparent;background:var(--border);color:var(--text2);user-select:none}
.alin-chip.print{background:rgba(37,99,235,.12);color:var(--accent);border-color:rgba(37,99,235,.25)}
.alin-chip.thermo{background:rgba(124,58,237,.12);color:var(--st);border-color:rgba(124,58,237,.25)}
.alin-chip.cut{background:rgba(234,88,12,.12);color:var(--sc);border-color:rgba(234,88,12,.25)}
.alin-chip.polish{background:rgba(8,145,178,.12);color:var(--spo);border-color:rgba(8,145,178,.25)}
.alin-chip.pendiente{background:var(--border);color:var(--text3);opacity:.6}
.alin-chip.done{background:rgba(100,116,139,.1);color:var(--done);border-color:rgba(100,116,139,.2);text-decoration:line-through}
.alin-chip.selected{outline:2px solid var(--accent);outline-offset:1px;z-index:2;transform:scale(1.1)}
.arcada-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.arcada-actions select{padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;font-family:'Inter',sans-serif}
.obs-note{margin-top:10px;font-size:11px;color:var(--text3)}

.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stock-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.stock-name{font-size:13px;font-weight:600;margin-bottom:4px}
.stock-type-lbl{font-size:10px;color:var(--text3);margin-bottom:12px}
.stock-level-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.stock-qty{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600}
.stock-qty.low{color:var(--red)}.stock-qty.medium{color:var(--yellow)}.stock-qty.good{color:var(--green)}
.stock-unit-lbl{font-size:10px;color:var(--text3)}
.stock-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px}
.stock-bar{height:100%;border-radius:3px}
.stock-bar.low{background:var(--red)}.stock-bar.medium{background:var(--yellow)}.stock-bar.good{background:var(--green)}
.stock-min-lbl{font-size:10px;color:var(--text3)}
.stock-alert-msg{font-size:10px;color:var(--red);margin-top:4px;font-weight:500}
.stock-actions{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.stock-btn{flex:1 1 auto;padding:7px 8px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;touch-action:manipulation;min-height:34px;text-align:center;font-family:'Inter',sans-serif}
.stock-btn:hover{border-color:var(--accent);color:var(--accent)}
.stock-btn.primary{border-color:rgba(22,163,74,.4);color:var(--green)}
.stock-btn.primary:hover{background:rgba(22,163,74,.06)}
.stock-btn.danger{border-color:rgba(220,38,38,.4);color:var(--red)}
.stock-btn.danger:hover{background:rgba(220,38,38,.06)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:var(--surface);border-top:1px solid var(--border);z-index:100;flex-direction:column;padding-bottom:var(--safe-b)}
.bottom-nav-inner{display:flex;height:var(--nav-h)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;border:none;background:none;color:var(--text3);font-family:'Inter',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.4px;transition:color .15s}
.bnav-item.active{color:var(--accent)}
.bnav-icon{font-size:18px}

.fab{display:none;position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:48px;height:48px;border-radius:50%;background:var(--accent);border:none;font-size:24px;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.3);z-index:99;touch-action:manipulation;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.93)}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 20px;padding-bottom:calc(20px + var(--safe-b));width:100%;max-width:600px;max-height:90dvh;overflow-y:auto;transform:translateY(40px);transition:transform .25s;position:relative}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;z-index:5;padding:5px}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:600;margin-bottom:16px;padding-right:30px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.form-input{padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color .15s;width:100%}
.form-input:focus{border-color:var(--accent)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:10px 16px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;transition:background .15s}
.btn-cancel:hover{background:var(--surface2)}
.btn-submit{flex:1;max-width:180px;padding:10px 18px;background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;transition:background .15s}
.btn-submit:hover{background:var(--accent2)}

.toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface);border:1px solid var(--green);color:var(--green);padding:10px 20px;border-radius:20px;font-size:12px;z-index:300;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(min-width:768px){main{padding:24px;padding-bottom:24px}.stats-grid{grid-template-columns:repeat(7,1fr)}.case-days{display:block}}
@media(min-width:1024px){.desktop-nav{display:flex}.bottom-nav{display:none!important}.fab{display:none!important}.btn-new{display:flex}.date-chip{display:block}.kanban{min-width:unset;grid-template-columns:repeat(4,1fr)}.kanban-wrap{overflow-x:visible;margin:0;padding:0}.modal{border-radius:12px;padding:24px}.modal-overlay{align-items:center}}
@media(max-width:767px){.desktop-nav{display:none}.btn-new{display:none}.bottom-nav{display:flex}.fab{display:flex}.kanban{min-width:900px;grid-template-columns:repeat(4,225px)}.arcadas-grid{grid-template-columns:1fr}.section-header{flex-direction:column;align-items:flex-start}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:1}.btn-cancel{display:none}.btn-submit{max-width:none}.stock-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
  <div class="logo">AlignerOS</div>
  <nav class="desktop-nav">
    <button class="tab active" onclick="switchView('kanban',this)">Producción</button>
    <button class="tab" onclick="switchView('casos',this)">Casos</button>
    <button class="tab" onclick="switchView('stock',this)">Stock</button>
  </nav>
  <div class="header-right">
    <div class="sync-indicator" id="syncIndicator">
      <span class="sync-dot offline" id="syncDot"></span>
      <span id="syncText">Offline</span>
    </div>
    <span class="date-chip" id="dateChip"></span>
    <button class="btn-new" onclick="openNewCase()">+ Nuevo caso</button>
  </div>
</header>

<main>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="alerts-bar" id="alertsBar"></div>

  <div id="view-kanban">
    <div class="filters-row">
      <span class="filter-label">Filtrar</span>
      <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('urgente',this)">Urgentes</button>
      <button class="filter-btn" onclick="setFilter('proximo',this)">Próximos</button>
      <button class="filter-btn" onclick="setFilter('sup',this)">Superior</button>
      <button class="filter-btn" onclick="setFilter('inf',this)">Inferior</button>
    </div>
    <div class="kanban-wrap"><div class="kanban" id="kanban"></div></div>
  </div>

  <div id="view-casos" style="display:none">
    <div class="section-header">
      <span class="section-title">Casos</span>
      <div class="filters-row" style="margin:0">
        <button class="filter-btn active" onclick="setCasosFilter('all',this)">Todos</button>
        <button class="filter-btn" onclick="setCasosFilter('urgente',this)">Urgentes</button>
        <button class="filter-btn" onclick="setCasosFilter('proximo',this)">Próximos</button>
        <select id="doctorFilter" class="form-input" style="width:auto;padding:6px 10px;font-size:11px" onchange="filterByDoctor()">
          <option value="all">Todos los doctores</option>
        </select>
      </div>
    </div>
    <div class="cases-list" id="casesList"></div>
  </div>

  <div id="view-stock" style="display:none">
    <div class="section-header">

<script>

// ==================== FIREBASE ====================
const firebaseConfig = {
  apiKey: "AIzaSyCSsY1tA5AFzIVj-Tbg-XjxoKY73W0YPZs",
  authDomain: "alingneros.firebaseapp.com",
  databaseURL: "https://alingneros-default-rtdb.firebaseio.com",
  projectId: "alingneros",
  storageBucket: "alingneros.firebasestorage.app",
  messagingSenderId: "868408246733",
  appId: "1:868408246733:web:4affa1c056767283b10484"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ==================== ESTADO ====================
const STAGES = ['Impresión','Termoformado','Corte','Pulido'];
const SKEYS = ['print','thermo','cut','polish'];
const SCOLS = {print:'#2563eb',thermo:'#7c3aed',cut:'#ea580c',polish:'#0891b2'};
const LS_KEY = 'alignerOS_v2';

let pendingWrite = null, writeTimer = null, repCtx = null, editingCaseId = null;
let selection = { caseId:null, arcType:null, indices:new Set() };
let kanbanOpenCard = null; // para selector desplegable en kanban

function uid(){ return Math.random().toString(36).slice(2,9); }
function daysFromNow(d){ const dt=new Date(); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); }
function makeArc(t){ return t ? { total:t, alinStates:new Array(t).fill(-1) } : null; }
function makeCase(patient,doctor,doctorId,sup,inf,delivery,obs){
  return { id:uid(), patient, doctor, doctorId:doctorId||'', delivery, obs, arcadas:{sup:makeArc(sup), inf:makeArc(inf)}, open:false };
}
function getPrio(d){ const t=new Date(); t.setHours(0,0,0,0); const diff=Math.ceil((new Date(d+'T00:00:00')-t)/86400000); return diff<=2?'urgente':diff<=5?'proximo':'ok'; }
function daysUntil(d){ const t=new Date(); t.setHours(0,0,0,0); return Math.ceil((new Date(d+'T00:00:00')-t)/86400000); }
function formatRanges(indices){
  if(!indices.length) return '';
  const sorted=[...indices].sort((a,b)=>a-b);
  const parts=[]; let start=sorted[0], end=sorted[0];
  for(let i=1;i<sorted.length;i++){
    if(sorted[i]===end+1){ end=sorted[i]; }
    else{ parts.push(start===end?`${start}`:`${start}-${end}`); start=sorted[i]; end=sorted[i]; }
  }
  parts.push(start===end?`${start}`:`${start}-${end}`);
  return parts.join(',');
}

function defaultState(){
  const cases=[];
  const c1=makeCase('García Martínez, Lucía','Dr. Pérez','DRPEREZ',22,15,daysFromNow(2),'Mordida cruzada');
  const sup1=c1.arcadas.sup;
  for(let i=0;i<22;i++){
    if(i<=2)sup1.alinStates[i]=0; else if(i<=7)sup1.alinStates[i]=1;
    else if(i<=16){if(i===10)sup1.alinStates[i]=3; else sup1.alinStates[i]=2;}
    else sup1.alinStates[i]=-1;
  }
  const inf1=c1.arcadas.inf;
  for(let i=0;i<15;i++){if(i<5)inf1.alinStates[i]=0; else if(i<10)inf1.alinStates[i]=1; else inf1.alinStates[i]=-1;}
  cases.push(c1);
  cases.push(makeCase('Rodríguez, Carlos','Dra. López','DRALOPEZ',18,18,daysFromNow(7),''));
  cases.push(makeCase('Fernández, Ana','Dr. Gómez','DRGOMEZ',30,0,daysFromNow(14),'Solo superior'));
  cases.push(makeCase('Jiménez, Pedro','Dra. Ruiz','DRARUIZ',12,12,daysFromNow(1),'URGENTE'));
  cases.push(makeCase('Torres, María','Dr. Pérez','DRPEREZ',20,16,daysFromNow(5),''));
  return { cases, stock:[
    {id:uid(),name:'Planchas 0.75mm',type:'Planchas',qty:45,min:30,unit:'láminas',max:200},
    {id:uid(),name:'Planchas 1.0mm',type:'Planchas',qty:12,min:20,unit:'láminas',max:100},
    {id:uid(),name:'Resina UV',type:'Resina',qty:3,min:2,unit:'kg',max:10},
    {id:uid(),name:'Bolsas',type:'Packaging',qty:180,min:50,unit:'unid',max:500},
  ]};
}

const state = {
  cases: [],
  stock: [],
  kFilter: 'all',
  cFilter: 'all',
  doctorFilter: 'all'
};

function loadLocal() {
  try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : defaultState(); }
  catch { return defaultState(); }
}
function saveLocal(data) { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
function pushToFirebase() {
  if (db) {
    pendingWrite = { cases: state.cases, stock: state.stock };
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => {
      if (pendingWrite) { db.ref('/').set(pendingWrite); pendingWrite = null; }
    }, 300);
  }
}

db.ref('/').on('value', snap => {
  const remote = snap.val();
  if (remote && remote.cases && remote.stock && !pendingWrite) {
    state.cases = remote.cases;
    state.stock = remote.stock;
    clearSelection();
    renderAll();
    updateSyncStatus(true);
  }
});
db.ref('.info/connected').on('value', snap => updateSyncStatus(snap.val() === true));
function updateSyncStatus(online) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (online) { dot.className = 'sync-dot'; txt.textContent = 'Sincronizado'; }
  else { dot.className = 'sync-dot offline'; txt.textContent = 'Offline'; }
}

const saved = loadLocal();
state.cases = saved.cases;
state.stock = saved.stock;

function renderAll() {
  renderStats();
  renderAlerts();
  renderKanban();
  renderCases();
  renderStock();
  saveLocal({ cases: state.cases, stock: state.stock });
  pushToFirebase();
}
const render = renderAll;

function countByStage() {
  const cnt = {0:0,1:0,2:0,3:0};
  state.cases.forEach(c => ['sup','inf'].forEach(at => {
    const a = c.arcadas[at]; if(!a) return;
    a.alinStates.forEach(st => { if(st>=0 && st<=3) cnt[st]++; });
  }));
  return cnt;
}
function renderStats() {
  const urg = state.cases.filter(c => getPrio(c.delivery)==='urgente').length;
  const prox = state.cases.filter(c => getPrio(c.delivery)==='proximo').length;
  const cnt = countByStage();
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-label">Urgentes</div><div class="stat-value ${urg>0?'urgent':''}">${urg}</div></div>
    <div class="stat-card"><div class="stat-label">Próximos</div><div class="stat-value ${prox>0?'warning':''}">${prox}</div></div>
    <div class="stat-card"><div class="stat-label">Casos</div><div class="stat-value">${state.cases.length}</div></div>
    <div class="stat-card"><div class="stat-label">Impresión</div><div class="stat-value" style="color:var(--sp)">${cnt[0]}</div></div>
    <div class="stat-card"><div class="stat-label">Termo.</div><div class="stat-value" style="color:var(--st)">${cnt[1]}</div></div>
    <div class="stat-card"><div class="stat-label">Corte</div><div class="stat-value" style="color:var(--sc)">${cnt[2]}</div></div>
    <div class="stat-card"><div class="stat-label">Pulido</div><div class="stat-value" style="color:var(--spo)">${cnt[3]}</div></div>`;
}
function renderAlerts() {
  const a = [];
  state.cases.forEach(c => {
    if(getPrio(c.delivery)==='urgente') {
      const d = daysUntil(c.delivery);
      a.push({t:'red', m:`⚠ ${c.patient.split(',')[0]} — ${d<=0?'VENCIDO':d+'d'}`});
    }
  });
  state.stock.forEach(s => { if(s.qty<=s.min) a.push({t:'yellow', m:`⬡ ${s.name} (${s.qty} ${s.unit})`}); });
  if(!a.length) a.push({t:'green', m:'✓ Sin alertas'});
  document.getElementById('alertsBar').innerHTML = a.map(x => `<div class="alert-pill ${x.t}"><div class="alert-dot"></div>${x.m}</div>`).join('');
}

// ==================== KANBAN CON SELECCIÓN DIRECTA ====================
function renderKanban() {
  const f = state.kFilter;
  document.getElementById('kanban').innerHTML = SKEYS.map((key, stageIdx) => {
    const color = Object.values(SCOLS)[stageIdx];
    let cards = [];
    state.cases.forEach(c => ['sup','inf'].forEach(at => {
      const arc = c.arcadas[at]; if(!arc) return;
      const indices = [];
      arc.alinStates.forEach((st,i) => { if(st===stageIdx) indices.push(i); });
      if(!indices.length) return;
      const p = getPrio(c.delivery);
      if(f==='urgente' && p!=='urgente') return;
      if(f==='proximo' && p!=='proximo') return;
      if(f==='sup' && at!=='sup') return;
      if(f==='inf' && at!=='inf') return;
      cards.push({c,at,p,indices});
    }));
    cards.sort((a,b)=> ( {urgente:0,proximo:1,ok:2}[a.p] - {urgente:0,proximo:1,ok:2}[b.p] ));
    const body = cards.length ? cards.map(it => {
      const d = daysUntil(it.c.delivery);
      const rangeStr = formatRanges(it.indices);
      const cardId = `${it.c.id}-${it.at}`;
      return `<div class="arc-card ${it.p}">
        <div class="arc-top"><div style="min-width:0;flex:1"><div class="arc-patient">${it.c.patient.split(',')[0]}</div><div class="arc-doctor">${it.c.doctor} ${it.c.doctorId?`· ${it.c.doctorId}`:''}</div></div><span class="arc-type ${it.at}">${it.at.toUpperCase()}</span></div>
        <div class="alin-range">${rangeStr} (${it.indices.length} uds)</div>
        <div class="arc-bottom"><span class="delivery-chip ${it.p}">📅 ${d<=0?'VENCIDO':d+'d'}</span>
        <div class="quick-btns">
          <button class="qbtn" onclick="toggleKanbanSelector('${cardId}','${it.c.id}','${it.at}',${stageIdx})">Seleccionar</button>
          <button class="qbtn done-btn" onclick="completeStage('${it.c.id}','${it.at}',${stageIdx})">✓</button>
        </div></div>
        <div class="kanban-alin-selector" id="ksel-${cardId}">
          <div class="alin-grid" id="ksel-grid-${cardId}" style="max-height:100px;overflow-y:auto;margin-bottom:6px"></div>
          <select id="ksel-stage-${cardId}" class="form-input" style="margin-right:6px;padding:4px 8px;font-size:10px">
            <option value="0">Impresión</option><option value="1">Termoformado</option><option value="2">Corte</option><option value="3">Pulido</option><option value="4">Finalizado</option>
          </select>
          <button class="qbtn" style="color:var(--accent);border-color:var(--accent)" onclick="event.stopPropagation(); moveSelectedFromKanban('${cardId}','${it.c.id}','${it.at}','${stageIdx}')">Mover</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-col"><div class="empty-icon">◌</div>Sin pendientes</div>`;
    return `<div class="kanban-col"><div class="col-header"><div class="col-title"><div class="col-dot" style="background:${color}"></div>${STAGES[stageIdx]}</div><span class="col-count">${cards.length}</span></div><div class="col-body">${body}</div></div>`;
  }).join('');
}

function toggleKanbanSelector(cardId, caseId, arcType, stageIdx) {
  const selector = document.getElementById(`ksel-${cardId}`);
  if (!selector) return;
  const isOpen = selector.classList.contains('open');
  // Cerrar todos los selectores abiertos primero
  document.querySelectorAll('.kanban-alin-selector.open').forEach(s => s.classList.remove('open'));
  if (isOpen) return;

  const c = state.cases.find(x => x.id === caseId);
  if (!c) return;
  const arc = c.arcadas[arcType];
  if (!arc) return;
  const indices = [];
  arc.alinStates.forEach((st, i) => {
    if (st === stageIdx) indices.push(i);
  });

  const grid = document.getElementById(`ksel-grid-${cardId}`);
  grid.innerHTML = indices.map(i =>
    `<span class="kanban-alin-item" data-idx="${i}" onclick="event.stopPropagation(); this.classList.toggle('selected')">${i}</span>`
  ).join('');

  selector.classList.add('open');
}

function moveSelectedFromKanban(cardId, caseId, arcType, currentStageIdx) {
  // Asegurar que currentStageIdx sea número
  currentStageIdx = parseInt(currentStageIdx, 10);
  const selector = document.getElementById(`ksel-${cardId}`);
  if (!selector) return;

  const selected = selector.querySelectorAll('.kanban-alin-item.selected');
  if (selected.length === 0) {
    alert('Seleccioná al menos un alineador');
    return;
  }

  const targetStage = parseInt(document.getElementById(`ksel-stage-${cardId}`).value, 10);
  if (isNaN(targetStage)) return;

  const c = state.cases.find(x => x.id === caseId);
  if (!c) return;
  const arc = c.arcadas[arcType];
  if (!arc) return;

  let count = 0;
  selected.forEach(el => {
    const idx = parseInt(el.dataset.idx, 10);
    if (!isNaN(idx) && arc.alinStates[idx] === currentStageIdx) {
      arc.alinStates[idx] = targetStage;
      count++;
    }
  });

  if (count > 0) {
    // Limpiar selección visual y cerrar
    selected.forEach(el => el.classList.remove('selected'));
    selector.classList.remove('open');
    renderAll();
    showToast(`${count} alin. → ${targetStage === 4 ? 'Finalizado' : STAGES[targetStage]}`);
  } else {
    alert('Ninguno de los alineadores seleccionados está en la etapa actual. Probá recargar el selector.');
  }
}

function completeStage(caseId, arcType, stageIdx) {
  const c = state.cases.find(x=>x.id===caseId); if(!c) return;
  const arc = c.arcadas[arcType]; if(!arc) return;
  if(stageIdx !== null && stageIdx !== undefined) {
    const next = stageIdx<3 ? stageIdx+1 : 4;
    let count = 0;
    arc.alinStates.forEach((st,i) => { if(st===stageIdx) { arc.alinStates[i]=next; count++; } });
    if(count>0) { renderAll(); showToast(`${count} uds → ${next===4?'Finalizado ✓':STAGES[next]}`); }
    else showToast('Sin alineadores en esa etapa');
  } else {
    let count = 0;
    arc.alinStates.forEach((st,i) => {
      if(st>=0 && st<3) { arc.alinStates[i]=st+1; count++; }
      else if(st===3) { arc.alinStates[i]=4; count++; }
    });
    if(count>0) { renderAll(); showToast(`${count} alineadores avanzados`); }
    else showToast('Nada para avanzar');
  }
}

// ==================== CASOS ====================
function renderCases() {
  const f = state.cFilter;
  let list = state.cases;
  if (f !== 'all') list = list.filter(c => getPrio(c.delivery) === f);
  if (state.doctorFilter !== 'all') list = list.filter(c => c.doctorId === state.doctorFilter);

  const bmap = {urgente:'<span class="case-badge urgente">⚠ URGENTE</span>',proximo:'<span class="case-badge proximo">● PRÓXIMO</span>',ok:'<span class="case-badge ok">✓ OK</span>'};
  const dcol = {urgente:'var(--red)',proximo:'var(--yellow)',ok:'var(--green)'};
  const clsMap = ['print','thermo','cut','polish'];
  document.getElementById('casesList').innerHTML = list.map(c => {
    const p = getPrio(c.delivery); const d = daysUntil(c.delivery);
    const arcHtml = ['sup','inf'].map(at => {
      const arc = c.arcadas[at]; if(!arc) return '';
      const lbl = at==='sup'?'▲ Superior':'▼ Inferior';
      const selSame = selection.caseId===c.id && selection.arcType===at;
      const chips = arc.alinStates.map((st,i) => {
        let cls = 'pendiente';
        if(st>=0 && st<=3) cls = clsMap[st];
        else if(st===4) cls = 'done';
        const sel = selSame && selection.indices.has(i) ? ' selected' : '';
        return `<span class="alin-chip ${cls}${sel}" onclick="event.stopPropagation();toggleAlin('${c.id}','${at}',${i})">${i}${st===4?'✓':''}</span>`;
      }).join('');
      const selCount = selSame ? selection.indices.size : 0;
      const actHtml = selCount > 0 ? `
        <div class="arcada-actions">
          <select id="moveTarget-${c.id}-${at}" class="form-input" style="width:auto;padding:4px 8px;font-size:10px">
            <option value="0">Impresión</option><option value="1">Termoformado</option>
            <option value="2">Corte</option><option value="3">Pulido</option>
            <option value="4">Finalizado</option>
          </select>
          <button class="qbtn" style="color:var(--accent);border-color:var(--accent)" onclick="moveSelected('${c.id}','${at}')">Mover ${selCount}</button>
          <button class="qbtn" style="color:var(--text3)" onclick="clearSelection()">✕</button>
        </div>` : '';
      return `<div class="arcada-block">
        <div class="arcada-title"><span class="arc-badge ${at}">${lbl}</span><span class="arc-total-lbl">${arc.total} alin.</span></div>
        <div class="alin-grid">${chips}</div>
        ${actHtml}
        <div style="margin-top:6px"><button class="qbtn" onclick="event.stopPropagation();completeStage('${c.id}','${at}',null)">✓ Completar todo posible</button></div>
      </div>`;
    }).join('');
    return `<div class="case-card ${c.open?'open':''}" id="case-${c.id}">
      <div class="case-header">
        <div class="case-info" onclick="toggleCase('${c.id}')">
          <div class="case-prio-dot" style="background:${dcol[p]}"></div>
          <div><div class="case-name">${c.patient}</div><div class="case-doctor">${c.doctor} ${c.doctorId ? `· ${c.doctorId}` : ''}</div></div>
        </div>
        <div class="case-right">
          ${bmap[p]} <span class="case-days" style="${d<=0?'color:var(--red)':''}">${d<=0?'VENCIDO':d+'d'}</span>
          <button class="delete-case-btn" onclick="event.stopPropagation();editCase('${c.id}')">✎</button>
          <button class="delete-case-btn" onclick="event.stopPropagation();deleteCase('${c.id}')">🗑</button>
          <span class="chevron" onclick="toggleCase('${c.id}')">▶</span>
        </div>
      </div>
      ${c.open ? `<div class="case-body"><div class="arcadas-grid">${arcHtml}</div>${c.obs ? `<div class="obs-note">📝 ${c.obs}</div>` : ''}</div>` : ''}
    </div>`;
  }).join('');

  // Actualizar filtro de doctores
  const doctorSelect = document.getElementById('doctorFilter');
  const doctors = [...new Set(state.cases.map(c => c.doctorId).filter(Boolean))];
  doctorSelect.innerHTML = '<option value="all">Todos los doctores</option>' + doctors.map(id => `<option value="${id}">${id}</option>`).join('');
  doctorSelect.value = state.doctorFilter;
}

function filterByDoctor() {
  state.doctorFilter = document.getElementById('doctorFilter').value;
  renderCases();
}

function clearSelection() { selection={caseId:null,arcType:null,indices:new Set()}; renderCases(); }
function toggleAlin(caseId, arcType, idx) {
  if(selection.caseId!==caseId || selection.arcType!==arcType) {
    selection = {caseId, arcType, indices: new Set([idx])};
  } else {
    if(selection.indices.has(idx)) selection.indices.delete(idx);
    else selection.indices.add(idx);
    if(selection.indices.size===0) clearSelection();
  }
  renderCases();
}
function moveSelected(caseId, arcType) {
  const sel = document.getElementById(`moveTarget-${caseId}-${arcType}`);
  if(!sel) return;
  const target = parseInt(sel.value);
  const c = state.cases.find(x=>x.id===caseId); if(!c) return;
  const arc = c.arcadas[arcType]; if(!arc) return;
  selection.indices.forEach(i => { arc.alinStates[i] = target; });
  clearSelection();
  renderAll();
  showToast(`${selection.indices.size} alin. → ${target===4?'Finalizado':STAGES[target]}`);
}

// ==================== CRUD CASOS ====================
function openNewCase() {
  editingCaseId = null;
  document.getElementById('caseModalTitle').textContent = 'Nuevo caso';
  document.getElementById('caseSubmitBtn').textContent = 'Crear';
  ['f-patient','f-doctor','f-doctorId','f-sup','f-inf','f-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-date').value = daysFromNow(7);
  openModal('newCaseModal');
}
function submitNewCase() {
  const p = document.getElementById('f-patient').value.trim();
  const dr = document.getElementById('f-doctor').value.trim();
  const did = document.getElementById('f-doctorId').value.trim();
  const s = parseInt(document.getElementById('f-sup').value) || 0;
  const inf = parseInt(document.getElementById('f-inf').value) || 0;
  const d = document.getElementById('f-date').value;
  const ob = document.getElementById('f-obs').value.trim();
  if(!p || !dr || !d) { alert('Completá paciente, doctor y fecha'); return; }
  if(editingCaseId) {
    const c = state.cases.find(x=>x.id===editingCaseId);
    if(c) {
      c.patient = p; c.doctor = dr; c.doctorId = did; c.delivery = d; c.obs = ob;
      if(s>0) { if(!c.arcadas.sup) c.arcadas.sup = makeArc(s); else c.arcadas.sup.total = s; }
      else c.arcadas.sup = null;
      if(inf>0) { if(!c.arcadas.inf) c.arcadas.inf = makeArc(inf); else c.arcadas.inf.total = inf; }
      else c.arcadas.inf = null;
    }
  } else {
    state.cases.unshift(makeCase(p,dr,did,s,inf,d,ob));
  }
  closeModal('newCaseModal');
  editingCaseId = null;
  renderAll();
  showToast('Caso guardado ✓');
}
function editCase(id) {
  const c = state.cases.find(x=>x.id===id); if(!c) return;
  editingCaseId = id;
  document.getElementById('caseModalTitle').textContent = 'Editar caso';
  document.getElementById('caseSubmitBtn').textContent = 'Guardar cambios';
  document.getElementById('f-patient').value = c.patient;
  document.getElementById('f-doctor').value = c.doctor;
  document.getElementById('f-doctorId').value = c.doctorId || '';
  document.getElementById('f-sup').value = c.arcadas.sup?.total || '';
  document.getElementById('f-inf').value = c.arcadas.inf?.total || '';
  document.getElementById('f-date').value = c.delivery;
  document.getElementById('f-obs').value = c.obs || '';
  openModal('newCaseModal');
}
function deleteCase(id) {
  if(!confirm('¿Eliminar este caso?')) return;
  state.cases = state.cases.filter(c => c.id!==id);
  clearSelection();
  renderAll();
  showToast('Caso eliminado');
}

// ==================== STOCK ====================
function openStockModal() { openModal('stockModal'); }
function submitStock() {
  const name = document.getElementById('sm-name').value.trim();
  if(!name) { alert('Nombre requerido'); return; }
  state.stock.push({
    id: uid(), name,
    type: document.getElementById('sm-type').value,
    unit: document.getElementById('sm-unit').value.trim() || 'unid',
    qty: parseInt(document.getElementById('sm-qty').value) || 0,
    min: parseInt(document.getElementById('sm-min').value) || 10,
    max: 200
  });
  closeModal('stockModal');
  renderAll();
  showToast('Material agregado ✓');
}
function adjStock(id, delta) { const s = state.stock.find(x=>x.id===id); if(s) { s.qty = Math.max(0, s.qty+delta); renderAll(); } }
function deleteStock(id) { if(confirm('Eliminar?')) { state.stock = state.stock.filter(s=>s.id!==id); renderAll(); } }
function openReponer(id) {
  repCtx = id;
  const s = state.stock.find(x=>x.id===id); if(!s) return;
  document.getElementById('rm-title').textContent = `Reponer: ${s.name}`;
  document.getElementById('rm-sub').textContent = `Actual: ${s.qty} ${s.unit}`;
  openModal('reponerModal');
}
function addRepQty(n) { const i=document.getElementById('rm-inp'); i.value = (parseInt(i.value)||0) + n; }
function confirmReponer() {
  const n = parseInt(document.getElementById('rm-inp').value);
  if(!n || n<=0) { alert('Ingresá cantidad'); return; }
  const s = state.stock.find(x=>x.id===repCtx);
  if(s) { s.qty += n; closeModal('reponerModal'); renderAll(); showToast(`+${n} ${s.unit}`); }
}

// ==================== NAVEGACIÓN Y MODALES ====================
function switchView(v, el) {
  document.querySelectorAll('.desktop-nav .tab, .bnav-item').forEach(b => b.classList.remove('active'));
  if(el) el.classList.add('active');
  ['kanban','casos','stock'].forEach(x => document.getElementById('view-'+x).style.display = x===v ? '' : 'none');
}
function setFilter(f, el) { state.kFilter=f; document.querySelectorAll('#view-kanban .filter-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderKanban(); }
function setCasosFilter(f, el) { state.cFilter=f; document.querySelectorAll('#view-casos .filter-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderCases(); }
function toggleCase(id) { const c = state.cases.find(x=>x.id===id); if(c){ c.open=!c.open; clearSelection(); renderCases(); } }

function openModal(id) { document.getElementById(id).classList.add('open'); document.body.classList.add('modal-open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); if(!document.querySelector('.modal-overlay.open')) document.body.classList.remove('modal-open'); }
document.addEventListener('keydown', e => { if(e.key==='Escape') { document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open')); document.body.classList.remove('modal-open'); } });
document.addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) { e.target.classList.remove('open'); if(!document.querySelector('.modal-overlay.open')) document.body.classList.remove('modal-open'); } });

let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== INICIAR ====================
document.getElementById('dateChip').textContent = new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('bn-kanban').classList.add('active');
updateSyncStatus(false);
renderAll();
</script>
