<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AlignerOS">
<meta name="theme-color" content="#2563eb">
<title>AlignerOS · Lab</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpolygon points='256,32 464,160 464,352 256,480 48,352 48,160' fill='%232563eb'/%3E%3Ctext x='256' y='300' text-anchor='middle' font-family='Inter,sans-serif' font-weight='bold' font-size='140' fill='white'%3EOS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <button class="btn-undo" id="btnUndo" disabled onclick="undo()" title="Deshacer (Ctrl+Z)">↩ Deshacer</button>
  <button class="btn-undo" onclick="startVoiceCommand()" title="Comando de voz (Ctrl+M)" style="margin-right:8px">🎙️</button>
  <div class="logo">AlignerOS</div>
  <nav class="desktop-nav">
    <button class="tab active" onclick="switchView('kanban',this)">Producción</button>
    <button class="tab" onclick="switchView('casos',this)">Casos</button>
    <button class="tab" onclick="switchView('stock',this)">Stock</button>
  </nav>
  <div class="header-right">
    <button class="activity-btn" onclick="openActivityModal()" title="Registro de actividad">📋<span class="activity-badge" id="activityBadge" style="display:none">0</span></button>
    <div class="sync-indicator" id="syncIndicator" onclick="syncFromFirebase()" title="Tocar para sincronizar">
      <span class="sync-dot offline" id="syncDot"></span>
      <span id="syncText">Offline</span>
    </div>
    <button class="btn-new" onclick="openNewCase()">+ Nuevo caso</button>
  </div>
</header>

<main>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="progress-bar-container" id="progressBarContainer"></div>
  <div class="alerts-bar" id="alertsBar"></div>

  <div id="view-kanban">
    <div class="filters-row">
      <span class="filter-label">Filtrar</span>
      <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('urgente',this)">Urgentes</button>
      <button class="filter-btn" onclick="setFilter('proximo',this)">Próximos</button>
      <button class="filter-btn" onclick="setFilter('sup',this)">Superior</button>
      <button class="filter-btn" onclick="setFilter('inf',this)">Inferior</button>
      <input class="filter-input" type="text" id="patientFilterInput" placeholder="Paciente..." oninput="filterByPatient()">
    </div>
    <div class="kanban-wrap"><div class="kanban" id="kanban"></div></div>
  </div>

  <div id="view-casos" style="display:none">
    <div class="section-header">
      <span class="section-title">Casos</span>
      <div class="filters-row" style="margin:0">
        <button class="filter-btn active" onclick="setCasosFilter('all',this)">Todos</button>
        <button class="filter-btn" onclick="setCasosFilter('urgente',this)">Urgentes</button>
        <button class="filter-btn" onclick="setCasosFilter('proximo',this)">Próximos</button>
        <input class="filter-input" type="text" id="doctorFilterInput" placeholder="Doctor (ej. GM)..." oninput="filterByDoctor()">
      </div>
    </div>
    <div class="cases-list" id="casesList"></div>
  </div>

  <div id="view-stock" style="display:none">
    <div class="section-header">
      <span class="section-title">Stock</span>
      <button class="btn-new" style="display:flex" onclick="openStockModal()">+ Agregar</button>
    </div>
    <div class="stock-grid" id="stockGrid"></div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bnav-item active" id="bn-kanban" onclick="switchView('kanban',this)"><span class="bnav-icon">▦</span><span>Prod.</span></button>
    <button class="bnav-item" id="bn-casos" onclick="switchView('casos',this)"><span class="bnav-icon">⧉</span><span>Casos</span></button>
    <button class="bnav-item" id="bn-stock" onclick="switchView('stock',this)"><span class="bnav-icon">◈</span><span>Stock</span></button>
  </div>
</nav>
<button class="fab" onclick="openNewCase()">+</button>

<!-- Modal Actividad -->
<div class="modal-overlay" id="activityModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('activityModal')">&times;</button>
    <div class="modal-handle"></div>
    <div class="modal-title">Registro de actividad</div>
    <div class="activity-modal-content" id="activityContent"></div>
    <div class="form-actions" style="margin-top:12px">
      <button class="btn-submit" onclick="clearActivity()" style="background:var(--red);max-width:100%">Limpiar historial</button>
    </div>
  </div>
</div>

<!-- Modal Nuevo/Editar Caso -->
<div class="modal-overlay" id="newCaseModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('newCaseModal')">&times;</button>
    <div class="modal-handle"></div>
    <div class="modal-title" id="caseModalTitle">Nuevo caso</div>
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">Paciente</label><input class="form-input" id="f-patient" placeholder="Nombre completo"></div>
      <div class="form-group"><label class="form-label">Doctor</label><input class="form-input" id="f-doctor" placeholder="Dr. Apellido"></div>
      <div class="form-group"><label class="form-label">ID Doctor</label><input class="form-input" id="f-doctorId" placeholder="Código"></div>
      <div class="form-group"><label class="form-label">Al. Superior</label><input class="form-input" id="f-sup" type="number" placeholder="ej: 22"></div>
      <div class="form-group"><label class="form-label">Al. Inferior</label><input class="form-input" id="f-inf" type="number" placeholder="ej: 15"></div>
      <div class="form-group"><label class="form-label">Entrega</label><input class="form-input" id="f-date" type="date"></div>
      <div class="form-group full"><label class="form-label">Notas</label><input class="form-input" id="f-obs" placeholder="Opcional..."></div>
    </div>
    <div class="form-actions"><button class="btn-cancel" onclick="closeModal('newCaseModal')">Cancelar</button><button class="btn-submit" id="caseSubmitBtn" onclick="submitNewCase()">Crear</button></div>
  </div>
</div>

<!-- Modal Stock -->
<div class="modal-overlay" id="stockModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('stockModal')">&times;</button>
    <div class="modal-handle"></div>
    <div class="modal-title" id="stockModalTitle">Agregar material</div>
    <div class="form-grid">
      <div class="form-group full"><label class="form-label">Nombre</label><input class="form-input" id="sm-name"></div>
      <div class="form-group"><label class="form-label">Tipo</label><select class="form-input" id="sm-type"><option>Planchas</option><option>Resina</option><option>Packaging</option></select></div>
      <div class="form-group"><label class="form-label">Unidad</label><input class="form-input" id="sm-unit" placeholder="láminas"></div>
      <div class="form-group"><label class="form-label">Stock</label><input class="form-input" id="sm-qty" type="number"></div>
      <div class="form-group"><label class="form-label">Mínimo</label><input class="form-input" id="sm-min" type="number"></div>
    </div>
    <div class="form-actions"><button class="btn-cancel" onclick="closeModal('stockModal')">Cancelar</button><button class="btn-submit" id="stockSubmitBtn" onclick="submitStock()">Guardar</button></div>
  </div>
</div>

<!-- Modal Confirmación de Voz -->
<div class="modal-overlay" id="voiceConfirmModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('voiceConfirmModal')">&times;</button>
    <div class="modal-handle"></div>
    <div class="modal-title">Comando de voz detectado</div>
    <div id="voiceConfirmContent" style="font-size:13px;color:var(--text2);margin-bottom:16px"></div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal('voiceConfirmModal')">Cancelar</button>
      <button class="btn-submit" onclick="executeVoiceCommand()">Ejecutar</button>
      <button class="btn-cancel" onclick="startVoiceCommand()">🎙️ Volver a dictar</button>
    </div>
  </div>
</div>

<!-- Modal Reponer -->
<div class="modal-overlay" id="reponerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('reponerModal')">&times;</button>
    <div class="modal-handle"></div>
    <div class="modal-title" id="rm-title">Reponer</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:12px" id="rm-sub"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <button class="qbtn" onclick="addRepQty(10)">+10</button><button class="qbtn" onclick="addRepQty(25)">+25</button>
      <button class="qbtn" onclick="addRepQty(50)">+50</button><button class="qbtn" onclick="addRepQty(100)">+100</button>
    </div>
    <input class="form-input" id="rm-inp" type="number" placeholder="Cantidad" style="text-align:center;font-size:18px;padding:12px">
    <div class="form-actions" style="margin-top:14px"><button class="btn-cancel" onclick="closeModal('reponerModal')">Cancelar</button><button class="btn-submit" onclick="confirmReponer()">Confirmar</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Archivos JS en orden -->
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
